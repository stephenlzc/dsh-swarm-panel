# dsh-swarm-panel CI. This standalone repo is not the deepseek-harness
# monorepo. Host typecheck / vitest / tsdown still require a DSH workspace
# for @deepseek-ai/* peers, so they are not run here.
name: dsh-swarm-panel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  package-hygiene:
    name: package hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
      - name: Validate publish metadata
        working-directory: dsh-swarm-plugin
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          for (const field of ['repository', 'homepage', 'bugs', 'engines']) {
            if (!pkg[field]) throw new Error(`missing package metadata: ${field}`)
          }
          for (const section of ['peerDependencies', 'dependencies']) {
            for (const [name, range] of Object.entries(pkg[section] ?? {})) {
              if (String(range).startsWith('workspace:')) throw new Error(`${section}.${name} still uses ${range}`)
            }
          }
          for (const file of pkg.files ?? []) {
            if (file.includes('*')) continue
            if (!readFileSync(file)) throw new Error(`unreadable published file: ${file}`)
          }
          NODE
      - name: Inspect npm package contents
        working-directory: dsh-swarm-plugin
        run: npm pack --dry-run --json

  harness-source-checks:
    name: Harness source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.2.0-rc.2
          path: harness
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml
      - name: Mount this plugin into the matching Harness workspace
        working-directory: harness
        run: |
          mkdir -p plugins
          rm -rf plugins/dsh-swarm-panel
          # Copy, do not symlink: pnpm only materializes node_modules and a
          # lockfile importer for workspace packages that live inside the
          # workspace root. A symlink to $GITHUB_WORKSPACE leaves the package
          # without node_modules and with a stale importer, so the later
          # `CI=true pnpm run ...` fails verify-deps-before-run with
          # ERR_PNPM_OUTDATED_LOCKFILE (and tsc cannot resolve @types/node).
          cp -R "$GITHUB_WORKSPACE/dsh-swarm-plugin" plugins/dsh-swarm-panel
          # Harness 0.2.0 dropped two things this standalone checkout needs:
          #   * the plugins/* workspace glob, so the mounted plugin joins the
          #     workspace at all (its development dependencies use workspace:*);
          #   * linkWorkspacePackages: true, without which the plugin's public
          #     peer/dependency ranges resolve duplicate REGISTRY copies instead
          #     of linking the workspace packages, breaking branded-symbol
          #     identity in tsc and duplicating service singletons at runtime.
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs')
          const file = 'pnpm-workspace.yaml'
          let text = fs.readFileSync(file, 'utf8')
          if (!/^\s*-\s*['"]?plugins\/\*['"]?\s*$/m.test(text)) {
            if (!/^packages:\s*$/m.test(text)) throw new Error('pnpm-workspace.yaml has no packages: block')
            text = text.replace(/^packages:\s*$/m, "packages:\n  - 'plugins/*'")
          }
          if (!/^linkWorkspacePackages:/m.test(text)) {
            text = text.replace(/^overrides:\s*$/m, "linkWorkspacePackages: true\n\noverrides:")
            if (!/^linkWorkspacePackages:/m.test(text)) text += "\nlinkWorkspacePackages: true\n"
          }
          fs.writeFileSync(file, text)
          NODE
      - name: Install Harness dependencies
        working-directory: harness
        # The checked-out plugin is the CI subject, so its public peer/dependency
        # ranges intentionally differ from the Harness repository's lockfile
        # importer. The ephemeral CI workspace may resolve that importer afresh.
        run: pnpm install --no-frozen-lockfile
      - name: Verify the mounted plugin was installed
        working-directory: harness
        run: |
          echo "--- plugin node_modules ---"
          ls -la plugins/dsh-swarm-panel/node_modules 2>&1 | head -20
          echo "--- @deepseek-ai links ---"
          ls -la plugins/dsh-swarm-panel/node_modules/@deepseek-ai 2>&1 | head -20
          echo "--- modules manifest ---"
          head -25 plugins/dsh-swarm-panel/node_modules/.modules.yaml 2>&1
          echo "--- root @deepseek-ai (hoist fallback) ---"
          ls node_modules/@deepseek-ai 2>&1 | head -20
          echo "--- pnpm view of the project ---"
          pnpm --filter dsh-swarm-panel list --depth -1 2>&1 | head -25
      - name: Typecheck plugin
        working-directory: harness
        run: CI=true pnpm --filter dsh-swarm-panel run typecheck
      - name: Test plugin
        working-directory: harness
        run: CI=true pnpm --filter dsh-swarm-panel run test
      - name: Build plugin
        working-directory: harness
        run: pnpm --filter dsh-swarm-panel run build
